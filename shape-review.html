<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひとふでヒント・字形の確認</title><link rel="stylesheet" href="style.css"><style>
body{background:#f7f5eb}main{max-width:1120px;margin:auto;padding:16px}h1{font-size:1.7rem}label{display:flex;flex-wrap:wrap;align-items:center;gap:8px}select,input{max-width:100%}.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.review-canvas{position:relative;aspect-ratio:1;background:white;border:2px solid #6e7b71;border-radius:12px;overflow:visible}canvas,svg{position:absolute;width:100%;height:100%;inset:0;touch-action:none}svg{pointer-events:none;overflow:visible}#actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#actions button{font-size:1rem;padding:12px}#issues button{display:block;width:100%;margin:8px 0;text-align:left}#issues small{display:block;font-size:.85rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid #ddd}#rules{font-size:.9rem}#rules li{margin:10px 0;overflow-wrap:anywhere}.notice{background:#fff0c8;border-radius:10px;padding:14px}@media(max-width:700px){.review-grid{grid-template-columns:1fr}main{padding:12px}h1{font-size:1.4rem}}
</style></head><body><main><p><a href="index.html">練習画面へ戻る</a></p><h1>先生向け：字形の規則と試し書き</h1><p class="notice">全1,026字の共通評価と部品評価を確認できます。追加の骨組み規則は資料・目視レビュー待ちです。合成筆跡のテストと児童の実筆跡による校正は別です。ここでの操作は学習記録を変更しません。</p>
<label>漢字を検索<input id="search" placeholder="見・月・土など" maxlength="20"></label><label>確認する字<select id="character"></select></label><label>評価の表示<select id="mode"><option value="normal">通常：未レビューの誤りは自己確認</option><option value="evaluation">検証用：候補の測定結果を表示</option></select></label><label>許容幅<select id="level"><option value="relaxed">ゆるめ</option><option value="normal" selected>標準</option><option value="strict">厳しめ</option></select></label>
<div id="actions"><button id="reference">手本の筆跡を入れる</button><button id="missing">内側の横線を1本減らす</button><button id="extra">内側の横線を1本増やす</button><button id="retrace">横線をなぞり直す</button><button id="clear">消して試し書き</button><button id="undo">一筆戻す</button><button id="check" class="primary">確かめる</button></div>
<div class="review-grid"><section><h2>書いた字と注目箇所</h2><div class="review-canvas"><canvas id="ink" width="654" height="654"></canvas><svg id="focus" viewBox="0 0 109 109"></svg></div><p id="message" aria-live="polite"></p><div id="issues"></div></section><section><h2>この字に適用する規則</h2><p id="coverage"></p><ul id="rules"></ul></section></div>
<details><summary>診断結果（規則・役割・測定値・設定）</summary><pre id="diagnostics"></pre></details><h2>全字の対応状況</h2><p id="totals"></p><div class="table-scroll"><table><thead><tr><th>字</th><th>学年</th><th>部品</th><th>規則</th><th>教育上の確認・実筆跡</th></tr></thead><tbody id="catalog"></tbody></table></div>
<p>部品・筆順：KanjiVG / Ulrich Apel · CC BY-SA 3.0。部首候補：部首ハンターの派生データ · CC BY-SA 4.0。数値は試作値です。</p></main><script type="module" src="shape-review.mjs"></script></body></html>
